<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Push Messages">
  <title>Push Messages</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#5FC8F5"/>
      <stop offset="100%" stop-color="#265FC6"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0B3F66" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <g transform="translate(62,62)" filter="url(#lift)">
    <!-- Motion trail -->
    <path d="M-48,30 q16,7 27,-7" fill="none" stroke="#FFC24D" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M-44,42 q11,4 18,-5" fill="none" stroke="#3FD8B4" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Paper plane -->
    <polygon points="-42,-2 42,-34 2,12" fill="#ffffff"/>
    <polygon points="2,12 42,-34 18,40" fill="#BFD6F2"/>
    <polygon points="-42,-2 2,12 -10,2" fill="#E6F3FF"/>
  </g>
</svg>
